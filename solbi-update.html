<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>솔비 앱 업데이트</title>
  <link rel="icon" href="solbi-icon-192.png" />
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:#eeeef0;color:#24292c;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;line-height:1.6;word-break:keep-all}
    main{max-width:520px;margin:0 auto;padding:40px 16px}
    .card{border:1px solid #e4e6e7;border-radius:24px;background:#fff;padding:30px 24px;box-shadow:0 15px 42px #252d3510}
    .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.05em;color:#0e6b70;margin-bottom:14px}
    .eyebrow:before{content:'';width:7px;height:7px;background:#2a9997;border-radius:50%}
    h1{margin:0 0 10px;font-size:24px;letter-spacing:-.6px}
    #solbiUpdateStatus{margin:0 0 18px;color:#394247;font-size:15px}
    ol{margin:0 0 22px;padding-left:20px;color:#55606a;font-size:14px}
    li+li{margin-top:6px}
    .actions{display:flex;flex-direction:column;gap:10px}
    .actions a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border:1px solid #bad2d3;border-radius:12px;background:#fff;color:#0e6b70;font-size:15px;font-weight:600;text-decoration:none}
    .actions a[hidden]{display:none}
    .actions a.primary{background:#0e6b70;border-color:#0e6b70;color:#fff}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="eyebrow">SOLBI MOBILE</div>
      <h1 id="solbiUpdateTitle">솔비 앱 업데이트</h1>
      <p id="solbiUpdateStatus">설치 안내에서 'Android APK 받기'를 눌러 새 버전을 받아 주세요.</p>
      <ol>
        <li>다운로드가 끝나면 알림이나 다운로드 목록에서 받은 APK 파일을 엽니다.</li>
        <li>'업데이트' 또는 '설치'를 누릅니다. 기존 솔비 위에 설치되므로 앱을 지울 필요가 없습니다.</li>
        <li>처음이면 Android가 브라우저의 '이 출처 허용'을 물어봅니다. 한 번만 켜 주세요.</li>
      </ol>
      <div class="actions">
        <a id="solbiUpdateApk" class="primary" href="https://pathfinder-api.ziewise.com/m/install#android">설치 안내 열기</a>
        <a id="solbiUpdateGuide" hidden href="https://pathfinder-api.ziewise.com/m/install#android">설치 안내 보기</a>
      </div>
    </div>
  </main>
  <script>
  // Opened in the phone's browser from the update dialog of Solbi APK 1.0.0~1.0.2 (solar-server static/solbi-install.js):
  // those apps save report files only and open links to another host in the browser. ?v= names the published version;
  // on an Android browser the APK download starts at once (once per tab), and the button gets the same APK link.
  // Only the fixed APK path on the Pathfinder API host is ever opened: no other host, path or query is accepted.
  (function(){
    var match=/^\?v=(\d{1,4}\.\d{1,4}\.\d{1,4})$/.exec(location.search||'');
    if(!match)return;
    var version=match[1],apk='https://pathfinder-api.ziewise.com/static/downloads/solbi-mobile-'+version+'.apk';
    var ua=navigator.userAgent||'',android=/Android/.test(ua)&&!/SolbiAndroid\//.test(ua);
    var link=document.getElementById('solbiUpdateApk');
    document.getElementById('solbiUpdateTitle').textContent='솔비 '+version+' 업데이트';
    link.href=apk;link.textContent='APK 받기 ('+version+')';document.getElementById('solbiUpdateGuide').hidden=false;
    document.getElementById('solbiUpdateStatus').textContent=android
      ?'새 버전 APK를 받고 있습니다. 다운로드가 시작되지 않으면 아래 \'APK 받기\'를 눌러 주세요.'
      :'APK는 Android 휴대폰의 Chrome 또는 Samsung Internet에서 받아 설치합니다.';
    if(!android)return;
    var key='solbiUpdateStarted';
    try{if(sessionStorage.getItem(key)===version)return;sessionStorage.setItem(key,version);}catch(_){}
    location.replace(apk);
  })();
  </script>
</body>
</html>
